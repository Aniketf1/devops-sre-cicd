apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-ingress
 
spec:
  rules:
   ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: flask-service
                port:
                  number: 7000